 [project]
name = "ink-engine"
version = "1.0.0"
description = "A standalone Ink interactive-fiction interpreter and plugin engine, with no web framework or database of its own"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Benjamin Schollnick",email = "Benjamin@schollnick.net"}
]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)"
]

[project.urls]
Homepage = "https://github.com/bschollnick/ink_engine"
Repository = "https://github.com/bschollnick/ink_engine"
Issues = "https://github.com/bschollnick/ink_engine/issues"
Changelog = "https://github.com/bschollnick/ink_engine/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "ink_engine" }, { include = "if_session" }]

[tool.poetry.scripts]
ink-bundle = "ink_engine.bundle_cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mypy (>=2.0.0,<3.0.0)",
    "black (>=26,<27)",
    "isort (>=6.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "types-pyyaml (>=6.0.12.20260906,<7.0.0.0)",
    "ruff (>=0.16.8,<0.17.0)"
]

[tool.black]
line-length = 150

[tool.isort]
profile = "black"
src_paths = ["ink_engine", "if_session", "tests"]
skip_gitignore = true

[tool.mypy]
# No python_version pin: mypy then analyses for whichever interpreter it
# runs under, so the CI matrix checks each supported version for real.
explicit_package_bases = true
pretty = true
color_output = true
ignore_missing_imports = true
mypy_path = "."

[tool.pylint]
max-line-length = 150



[tool.ruff]
line-length = 150

[tool.ruff.lint]
# Errors, modernisation and correctness families. E501 is black's job and
# W is pycodestyle style, so neither is selected.
select = ["E4", "E7", "E9", "F", "UP", "RUF", "B", "SIM", "I", "PYI", "BLE", "S", "FURB"]

[tool.ruff.lint.per-file-ignores]
# S101: `assert` is how a test asserts.
"tests/*" = ["S101"]
# S101: every assert in these two is `x is not None` after logic that
# already guarantees it -- narrowing for the type checker, never
# validation, so stripping them under `python -O` changes nothing.
"ink_engine/engine.py" = ["S101"]
# BLE001/S110: `_binding_names` asks every plugin for its names on a
# throwaway state. A plugin needing real state must not break the check,
# so the failure is swallowed deliberately.
"ink_engine/binding.py" = ["S101", "BLE001", "S110", "SIM105"]
# BLE001: a game's own panel hook is application code; a failure is
# logged and the panel treated as absent rather than ending the turn.
"ink_engine/game_panel.py" = ["BLE001"]
# S311: a skill roll is game randomness seeded from the save, so it
# replays identically. Cryptographic randomness would break that.
"ink_engine/engine_plugins/skills.py" = ["S311"]
# BLE001: a thread body reports whatever it caught, which is the result
# under test. S310: one opt-in test fetches inkle's published docs.
"tests/test_engine_session_isolation.py" = ["S101", "BLE001"]
"tests/test_vendored_standard_is_current.py" = ["S101", "S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers"
